name: findly
description: "Findly - Lost and Found App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ^17.0.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.0
  connectivity_plus: ^7.0.0
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  get_it: ^9.1.1
  photo_view: ^0.15.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:

  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"